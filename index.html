<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chkara Agent</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            width: 100%;
            max-width: 800px;
            height: 90vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            text-align: center;
        }

        .header h1 {
            font-size: 24px;
            font-weight: 600;
        }

        .chat-area {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            background: #f8f9fa;
        }

        .message {
            margin-bottom: 15px;
            display: flex;
            flex-direction: column;
        }

        .message.user {
            align-items: flex-end;
        }

        .message.ai {
            align-items: flex-start;
        }

        .message-bubble {
            max-width: 70%;
            padding: 12px 16px;
            border-radius: 18px;
            word-wrap: break-word;
        }

        .message.user .message-bubble {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .message.ai .message-bubble {
            background: white;
            color: #333;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
        }

        .message-label {
            font-size: 12px;
            color: #666;
            margin-bottom: 5px;
            font-weight: 500;
        }

        .message img {
            max-width: 100%;
            border-radius: 10px;
            margin-top: 8px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }

        .input-area {
            padding: 20px;
            background: white;
            border-top: 1px solid #e0e0e0;
            display: flex;
            gap: 10px;
        }

        #messageInput {
            flex: 1;
            padding: 12px 16px;
            border: 2px solid #e0e0e0;
            border-radius: 25px;
            font-size: 14px;
            outline: none;
            transition: border-color 0.3s;
        }

        #messageInput:focus {
            border-color: #667eea;
        }

        #sendButton {
            padding: 12px 24px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 25px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        #sendButton:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        #sendButton:active {
            transform: translateY(0);
        }

        #sendButton:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .loading {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid #f3f3f3;
            border-top: 3px solid #667eea;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🤖 Chkara Agent</h1>
        </div>
        <div class="chat-area" id="chatArea">
            <div class="message ai">
                <div class="message-label">Chkara Agent</div>
                <div class="message-bubble">
                    こんにちは！私はChkara Agentです。メッセージを送信してください。「写真を撮って」「今の顔を見て」などと言うと、カメラで撮影して分析します。
                </div>
            </div>
        </div>
        <div class="input-area">
            <input type="text" id="messageInput" placeholder="メッセージを入力..." autocomplete="off">
            <button id="sendButton" onclick="sendMessage()">送信</button>
        </div>
    </div>

    <script>
        const chatArea = document.getElementById('chatArea');
        const messageInput = document.getElementById('messageInput');
        const sendButton = document.getElementById('sendButton');

        // Enterキーで送信
        messageInput.addEventListener('keypress', function(e) {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        });

        async function sendMessage() {
            const message = messageInput.value.trim();
            if (!message) return;

            // 入力欄を無効化
            messageInput.disabled = true;
            sendButton.disabled = true;

            // ユーザーメッセージを表示
            addMessage('user', message);
            messageInput.value = '';

            // ローディング表示
            const loadingId = addMessage('ai', '<div class="loading"></div>');

            try {
                const response = await fetch('/chat', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ message: message })
                });

                const data = await response.json();

                // ローディングを削除
                removeMessage(loadingId);

                if (data.error) {
                    addMessage('ai', `エラー: ${data.error}`);
                } else {
                    // AIの応答を表示
                    addMessage('ai', data.reply);

                    // 画像がある場合は表示
                    if (data.image) {
                        const img = document.createElement('img');
                        img.src = 'data:image/jpeg;base64,' + data.image;
                        img.alt = '撮影した画像';
                        addImageToLastMessage(img);
                    }
                }
            } catch (error) {
                removeMessage(loadingId);
                addMessage('ai', `エラーが発生しました: ${error.message}`);
            } finally {
                // 入力欄を再有効化
                messageInput.disabled = false;
                sendButton.disabled = false;
                messageInput.focus();
            }
        }

        function addMessage(type, content) {
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${type}`;
            
            const label = document.createElement('div');
            label.className = 'message-label';
            label.textContent = type === 'user' ? 'あなた' : 'Chkara Agent';
            
            const bubble = document.createElement('div');
            bubble.className = 'message-bubble';
            
            if (typeof content === 'string' && content.includes('<div class="loading">')) {
                bubble.innerHTML = content;
            } else {
                bubble.textContent = content;
            }
            
            messageDiv.appendChild(label);
            messageDiv.appendChild(bubble);
            chatArea.appendChild(messageDiv);
            
            // スクロールを最下部に
            chatArea.scrollTop = chatArea.scrollHeight;
            
            // ローディングメッセージの場合はIDを返す
            if (content.includes('loading')) {
                return messageDiv;
            }
            return null;
        }

        function removeMessage(messageElement) {
            if (messageElement && messageElement.parentNode) {
                messageElement.parentNode.removeChild(messageElement);
            }
        }

        function addImageToLastMessage(img) {
            const messages = chatArea.querySelectorAll('.message.ai');
            if (messages.length > 0) {
                const lastMessage = messages[messages.length - 1];
                const bubble = lastMessage.querySelector('.message-bubble');
                if (bubble) {
                    bubble.appendChild(img);
                    chatArea.scrollTop = chatArea.scrollHeight;
                }
            }
        }
    </script>
</body>
</html>
